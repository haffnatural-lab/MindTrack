<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f9f7fb"><title>MindTrack</title>
<style>
:root{--bg:#f9f7fb;--ink:#302b38;--muted:#817b89;--lav:#e9e0f2;--purple:#806a9b;--pink:#f7e1e8;--sage:#e1eee5;--blue:#e1edf4;--cream:#f5eedc;--white:#fff;--line:#eee9f1;--shadow:0 8px 24px #4c38500c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:24px 20px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:23px;letter-spacing:-.7px}.brand span{color:var(--purple)}.sub{color:var(--muted);font-size:12px;margin-top:3px}.avatar{width:42px;height:42px;border-radius:15px;background:var(--lav);display:grid;place-items:center;font-size:21px}.page{padding:4px 18px 20px}.hello{font-size:25px;font-weight:750;letter-spacing:-.8px;margin:5px 0}.muted{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:21px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#eee6f5,#f8e9ee);border:0;padding:20px}.hero h2{font-size:20px;margin:0 0 6px}.hero p{margin:0;color:#675c70;line-height:1.5}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 8px}.section-head h3{font-size:16px;margin:0}.link{background:none;color:var(--purple);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;min-height:104px;text-align:left;color:var(--ink)}.tile .emoji{font-size:24px}.tile b{display:block;margin:7px 0 3px}.tile small{color:var(--muted)}.metric{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.metric strong{font-size:18px}.pill{background:#f3eef7;color:#6f5b83;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.navin{width:100%;max-width:520px;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom))}.nav button{background:none;color:#958d9d;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:55px}.nav button span{font-size:20px}.nav button.active{color:var(--purple);font-weight:800}.btn{background:var(--purple);color:white;border-radius:14px;padding:12px 16px;font-weight:700;width:100%;margin-top:9px}.btn.secondary{background:#f0eaf5;color:#665579}.btn.light{background:#f7edf0;color:#9a6378}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #e8e1eb;border-radius:13px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:84px;resize:vertical}.row{display:flex;gap:9px}.row>*{flex:1}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{padding:9px 11px;border:1px solid #e9e3ed;border-radius:13px;background:#fff}.choice.selected{background:var(--lav);border-color:#bca9d0;color:#604c76;font-weight:800}.range{width:100%;accent-color:var(--purple)}.big-emoji{font-size:35px}.empty{text-align:center;padding:24px;color:var(--muted)}.bar{height:9px;background:#f0edf2;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#a58cba;border-radius:20px}.day{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.day:last-child{border:0}.tag{font-size:11px;background:#f3f0f5;padding:5px 8px;border-radius:20px}.breath{height:190px;display:grid;place-items:center}.orb{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle,#fff 0 38%,#d9c9e7 40% 65%,#eee6f5 68%);display:grid;place-items:center;font-weight:800;color:#6d5880;transition:transform 3s ease}.orb.in{transform:scale(1.25)}.groundrow{padding:12px 0;border-bottom:1px solid var(--line)}.groundrow:last-child{border:0}.groundrow b{display:block;margin-bottom:6px}.footnote{font-size:11px;color:var(--muted);line-height:1.5;margin:16px 2px}.hidden{display:none!important}.chart{display:flex;align-items:end;gap:7px;height:125px;padding:10px 4px 0}.colbar{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:5px}.colbar i{display:block;width:100%;max-width:28px;background:#c7b5d8;border-radius:8px 8px 3px 3px;min-height:3px}.colbar small{font-size:10px;color:var(--muted)}.danger{background:#fff4ed;border:1px solid #f3dfd1;color:#855a42;border-radius:15px;padding:12px;line-height:1.5}.safe{background:#edf5ef;border-radius:15px;padding:12px;color:#52745b;line-height:1.5}
</style></head><body><div class="app"><header class="top"><div><div class="brand">mind<span>track</span> <small style="font-size:10px;color:#a99bb5">●</small></div><div class="sub">Ruang aman untuk memahami diri</div></div><div class="avatar">🌿</div></header><main id="main" class="page"></main><nav class="nav"><div class="navin"><button data-tab="home" class="active"><span>⌂</span>Beranda</button><button data-tab="mood"><span>♡</span>Mood</button><button data-tab="tracker"><span>◷</span>Tracker</button><button data-tab="relax"><span>❀</span>Relaksasi</button><button data-tab="insight"><span>▥</span>Insight</button></div></nav></div>
<script>
const $=s=>document.querySelector(s), today=()=>new Date().toISOString().slice(0,10), load=()=>JSON.parse(localStorage.getItem('mindtrack_data')||'{"moods":[],"trackers":[],"journals":[]}'), save=d=>localStorage.setItem('mindtrack_data',JSON.stringify(d));let data=load(),tab='home';const emotions=[['😊','Bahagia'],['😄','Gembira'],['😌','Tenang'],['😢','Sedih'],['😠','Marah'],['😰','Gugup'],['😟','Cemas'],['😨','Takut'],['😲','Terkejut'],['😵','Bingung'],['😴','Mengantuk'],['😔','Lelah'],['🤒','Sakit'],['😊','Malu'],['🥰','Bangga']];
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function latest(a){return [...a].sort((x,y)=>y.date.localeCompare(x.date))[0]}function render(){data=load();let m=$('#main');if(tab==='home')m.innerHTML=home();if(tab==='mood')m.innerHTML=mood();if(tab==='tracker')m.innerHTML=tracker();if(tab==='relax')m.innerHTML=relax();if(tab==='insight')m.innerHTML=insight();}
function home(){let lm=latest(data.moods),lt=latest(data.trackers);return `<div class="hello">Halo, apa kabar hari ini? 🌷</div><div class="muted">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><section class="card hero"><h2>Pelan-pelan saja.</h2><p>Kamu tidak harus memahami semuanya hari ini. Mulai dengan mengenali apa yang sedang kamu rasakan.</p><button class="btn" onclick="go('mood')">Catat kondisi hari ini</button></section><div class="section-head"><h3>Ringkasan hari ini</h3><span class="pill">${today()}</span></div><div class="card"><div class="metric"><span>Suasana hati</span><strong>${lm&&lm.date===today()?esc(lm.emoji+' '+lm.emotion):'—'}</strong></div><div class="metric"><span>Tingkat energi</span><strong>${lt&&lt.date===today()?lt.energy+'/10':'—'}</strong></div><div class="metric"><span>Durasi tidur</span><strong>${lt&&lt.date===today()?lt.sleep+' jam':'—'}</strong></div></div><div class="section-head"><h3>Ruang perawatan diri</h3></div><div class="grid"><button class="tile" onclick="go('mood')"><span class="emoji">💗</span><b>Catat emosi</b><small>Kenali perasaanmu</small></button><button class="tile" onclick="go('tracker')"><span class="emoji">🌙</span><b>Energi & tidur</b><small>Pantau pola harian</small></button><button class="tile" onclick="go('relax')"><span class="emoji">🫧</span><b>Latihan tenang</b><small>Ambil jeda sejenak</small></button><button class="tile" onclick="go('insight')"><span class="emoji">🌱</span><b>Lihat perkembangan</b><small>Kenali pola, bukan menilai</small></button></div><div class="section-head"><h3>Pengingat lembut</h3></div><div class="safe">🌿 Jika energi terasa sangat meningkat sementara tidur berkurang, pertimbangkan untuk beristirahat, mengurangi stimulasi, dan menunda keputusan finansial besar sampai kamu merasa lebih stabil.</div><p class="footnote">MindTrack adalah alat refleksi dan pemantauan diri, bukan alat diagnosis atau pengganti bantuan profesional.</p>`}
function mood(){return `<div class="hello">Mood tracker 💗</div><p class="muted">Catat perasaanmu tanpa menghakimi diri sendiri.</p><div class="card"><div class="field"><label>Apa yang kamu rasakan?</label><div class="choices" id="emotionChoices">${emotions.map((e,i)=>`<button class="choice" data-e="${i}" onclick="pickEmotion(${i})">${e[0]} ${e[1]}</button>`).join('')}</div></div><div class="field"><label>Seberapa kuat perasaan ini? <b id="moodVal">5</b>/10</label><input id="moodIntensity" class="range" type="range" min="1" max="10" value="5" oninput="$('#moodVal').textContent=this.value"></div><div class="field"><label>Apa yang mungkin memicunya?</label><input id="trigger" placeholder="Contoh: pekerjaan, percakapan, kurang tidur"></div><div class="field"><label>Ceritakan sedikit (opsional)</label><textarea id="moodNote" placeholder="Apa yang sedang ada di pikiranmu?"></textarea></div><button class="btn" onclick="saveMood()">Simpan catatan emosi</button></div><div class="section-head"><h3>Riwayat emosi</h3></div><div class="card">${data.moods.length?data.moods.slice().reverse().slice(0,12).map(x=>`<div class="day"><div><b>${x.emoji} ${esc(x.emotion)}</b><div class="muted">${x.date} · Intensitas ${x.intensity}/10</div></div><span class="tag">${esc(x.trigger||'Tanpa pemicu')}</span></div>`).join(''):'<div class="empty">Belum ada catatan. Mulai dari satu check-in kecil.</div>'}</div>`}
let selectedEmotion=-1;function pickEmotion(i){selectedEmotion=i;document.querySelectorAll('[data-e]').forEach(b=>b.classList.toggle('selected',+b.dataset.e===i))}function saveMood(){if(selectedEmotion<0){alert('Pilih emosi terlebih dahulu.');return}let e=emotions[selectedEmotion];data.moods.push({date:today(),time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),emoji:e[0],emotion:e[1],intensity:+$('#moodIntensity').value,trigger:$('#trigger').value,note:$('#moodNote').value});save(data);selectedEmotion=-1;alert('Catatan tersimpan 🌷');render()}
function tracker(){let t=latest(data.trackers);return `<div class="hello">Energy & sleep 🌙</div><p class="muted">Perhatikan kebutuhan tubuhmu, bukan mengejar angka sempurna.</p><div class="card"><div class="field"><label>Tanggal</label><input type="date" id="trackDate" value="${today()}"></div><div class="field"><label>Tingkat energi <b id="energyVal">${t?.energy||5}</b>/10</label><input class="range" id="energy" type="range" min="1" max="10" value="${t?.energy||5}" oninput="$('#energyVal').textContent=this.value"></div><div class="field"><label>Durasi tidur (jam)</label><input id="sleep" type="number" min="0" max="24" step="0.5" placeholder="Contoh: 6.5" value="${t?.sleep||''}"></div><div class="field"><label>Kualitas tidur</label><div class="choices">${[1,2,3,4,5].map(n=>`<button class="choice ${t?.sleepQuality==n?'selected':''}" onclick="pickQuality(${n})" data-q="${n}">${n}</button>`).join('')}</div><small class="muted">1 = sangat buruk · 5 = sangat baik</small></div><div class="field"><label>Produktivitas hari ini</label><select id="productivity"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option></select></div><div class="field"><label>Konsentrasi</label><select id="focus"><option>Kesulitan fokus</option><option selected>Cukup fokus</option><option>Sangat fokus</option></select></div><div class="field"><label>Aktivitas / kondisi tubuh</label><textarea id="bodyNote" placeholder="Gelisah, lelah, aktif, sulit diam, dan sebagainya"></textarea></div><div class="field"><label>Impulsivitas hari ini</label><select id="impulse"><option>Tidak terasa</option><option>Ringan</option><option>Sedang</option><option>Kuat</option></select></div><div class="field"><label>Pengeluaran hari ini (Rp)</label><input id="spend" type="number" min="0" placeholder="0"></div><div class="field"><label>Apakah ada pembelian spontan?</label><select id="purchase"><option>Tidak</option><option>Ya</option></select></div><div class="field"><label>Catatan tambahan</label><textarea id="trackNote" placeholder="Hal yang ingin kamu ingat..."></textarea></div><button class="btn" onclick="saveTrack()">Simpan pemantauan</button></div><div class="section-head"><h3>Riwayat pemantauan</h3></div><div class="card">${data.trackers.length?data.trackers.slice().reverse().slice(0,10).map(x=>`<div class="day"><div><b>Energi ${x.energy}/10 · Tidur ${x.sleep||'—'} jam</b><div class="muted">${x.date} · Impulsivitas: ${esc(x.impulse)}</div></div><span class="tag">Rp ${Number(x.spend||0).toLocaleString('id-ID')}</span></div>`).join(''):'<div class="empty">Belum ada data pemantauan.</div>'}</div>`}let quality=3;function pickQuality(n){quality=n;document.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('selected',+b.dataset.q===n))}function saveTrack(){let x={date:$('#trackDate').value||today(),energy:+$('#energy').value,sleep:$('#sleep').value,sleepQuality:quality,productivity:$('#productivity').value,focus:$('#focus').value,bodyNote:$('#bodyNote').value,impulse:$('#impulse').value,spend:+$('#spend').value,purchase:$('#purchase').value,note:$('#trackNote').value};let i=data.trackers.findIndex(z=>z.date===x.date);if(i>=0)data.trackers[i]=x;else data.trackers.push(x);save(data);alert('Pemantauan tersimpan. Terima kasih sudah meluangkan waktu.');render()}
function relax(){return `<div class="hello">Ruang relaksasi 🫧</div><p class="muted">Pilih latihan singkat sesuai kebutuhanmu saat ini.</p><div class="grid"><button class="tile" onclick="exercise('breath')"><span class="emoji">🌬️</span><b>Deep breathing</b><small>Pernapasan perlahan</small></button><button class="tile" onclick="exercise('ground')"><span class="emoji">👁️</span><b>Grounding 5-4-3-2-1</b><small>Kembali ke saat ini</small></button><button class="tile" onclick="exercise('pmr')"><span class="emoji">🧘</span><b>Relaksasi otot</b><small>Lepaskan ketegangan</small></button><button class="tile" onclick="exercise('talk')"><span class="emoji">💬</span><b>Positive self-talk</b><small>Dialog yang suportif</small></button><button class="tile" onclick="exercise('letter')"><span class="emoji">✉️</span><b>Unsent letter</b><small>Tulis tanpa mengirim</small></button><button class="tile" onclick="exercise('cognitive')"><span class="emoji">🧠</span><b>Cognitive restructuring</b><small>Periksa pikiran otomatis</small></button><button class="tile" onclick="exercise('peace')"><span class="emoji">🏞️</span><b>Peaceful place</b><small>Visualisasi tempat nyaman</small></button></div><div id="exerciseArea"></div><p class="footnote">Hentikan latihan jika terasa tidak nyaman, pusing, mual, atau semakin tertekan. Kamu boleh memilih latihan lain atau beristirahat.</p>`}
function exercise(k){let a=$('#exerciseArea');let content={breath:`<h3>Deep breathing 🌬️</h3><p class="muted">Tarik napas perlahan dan embuskan dengan nyaman. Tidak perlu menahan napas.</p><div class="breath"><div class="orb" id="orb">Siap?</div></div><p id="breathText" style="text-align:center;font-weight:700">Tekan mulai saat siap.</p><button class="btn" onclick="breathStart()">Mulai latihan 1 menit</button>`,ground:`<h3>Grounding 5-4-3-2-1</h3><p class="muted">Arahkan perhatian pada lingkungan di sekitarmu.</p>${[['5','Benda yang bisa kamu lihat'],['4','Hal yang bisa kamu rasakan melalui sentuhan'],['3','Suara yang bisa kamu dengar'],['2','Aroma yang bisa kamu cium'],['1','Hal yang bisa kamu kecap']].map((x,i)=>`<div class="groundrow"><b>${x[0]} · ${x[1]}</b><input placeholder="Tuliskan di sini (opsional)"></div>`).join('')}<button class="btn" onclick="alert('Selesai. Terima kasih sudah kembali memperhatikan keadaan sekitar. 🌿')">Selesai</button>`,pmr:`<h3>Relaksasi otot progresif</h3><p>Jika nyaman, duduk atau berbaring. Kencangkan otot secara lembut selama beberapa detik, lalu lepaskan. Jangan menegangkan area yang sakit.</p>${['Tangan dan lengan','Bahu','Wajah dan rahang','Perut','Kaki'].map((x,i)=>`<div class="groundrow"><b>${i+1}. ${x}</b><small class="muted">Kencangkan dengan lembut, lalu lepaskan sambil mengembuskan napas.</small></div>`).join('')}<button class="btn" onclick="alert('Latihan selesai. Perhatikan apakah tubuh terasa berbeda.')">Selesai</button>`,talk:`<h3>Positive self-talk 💬</h3><p class="muted">Pilih kalimat yang terasa masuk akal bagimu.</p>${['Aku boleh beristirahat tanpa merasa bersalah.','Aku tidak harus menyelesaikan semuanya sekaligus.','Perasaan ini nyata, tetapi tidak harus menentukan tindakanku.','Aku bisa mengambil jeda sebelum memutuskan sesuatu.','Aku sedang belajar memahami diriku.'].map(x=>`<div class="groundrow">${x}</div>`).join('')}<div class="field"><label>Kalimat untuk diriku hari ini</label><textarea id="talkNote" placeholder="Tulis kalimatmu..."></textarea></div><button class="btn" onclick="saveJournal('Positive self-talk',$('#talkNote').value)">Simpan refleksi</button>`,letter:`<h3>Unsent letter ✉️</h3><p class="muted">Tuliskan apa yang ingin kamu sampaikan. Surat ini tidak perlu dikirim.</p><div class="field"><label>Surat untuk...</label><input id="letterTo" placeholder="Seseorang, situasi, atau diriku sendiri"></div><div class="field"><label>Isi surat</label><textarea id="letterText" rows="7" placeholder="Aku ingin mengatakan bahwa..."></textarea></div><button class="btn" onclick="saveJournal('Unsent letter', 'Untuk: '+$('#letterTo').value+'\\n'+$('#letterText').value)">Simpan secara pribadi</button>`,cognitive:`<h3>Cognitive restructuring 🧠</h3><p class="muted">Periksa pikiran secara lembut, bukan memaksa diri berpikir positif.</p>${[['Situasi','Apa yang terjadi?'],['Pikiran otomatis','Apa yang langsung terlintas?'],['Bukti yang mendukung','Apa faktanya?'],['Bukti yang tidak mendukung','Adakah fakta lain yang terlewat?'],['Pikiran alternatif','Apa cara pandang yang lebih seimbang?']].map((x,i)=>`<div class="field"><label>${x[0]}</label><textarea id="cog${i}" placeholder="${x[1]}"></textarea></div>`).join('')}<button class="btn" onclick="saveJournal('Cognitive restructuring',[0,1,2,3,4].map(i=>$('#cog'+i).value).join('\\n'))">Simpan latihan</button>`,peace:`<h3>Peaceful place 🏞️</h3><p>Bayangkan tempat yang membuatmu merasa nyaman. Bisa tempat nyata atau imajinasi.</p><div class="card" style="background:linear-gradient(145deg,#e6f0eb,#e9e1f2);text-align:center;padding:28px"><div style="font-size:45px">🌿 🏞️ ☁️</div><p>Perhatikan warna, cahaya, suara, suhu, dan suasana tempat itu. Bayangkan kamu berada di sana dengan aman dan nyaman.</p></div><div class="field"><label>Tempat nyamanku adalah...</label><textarea id="peaceNote" placeholder="Ceritakan tempat tersebut..."></textarea></div><button class="btn" onclick="saveJournal('Peaceful place',$('#peaceNote').value)">Simpan tempat nyaman</button>`};a.innerHTML=`<div class="card">${content[k]}</div>`;a.scrollIntoView({behavior:'smooth',block:'start'})}
let breathTimer=null;function breathStart(){let n=0,orb=$('#orb'),txt=$('#breathText');if(breathTimer)clearInterval(breathTimer);const phases=[['Tarik napas perlahan',true,4],['Embuskan perlahan',false,6]];function step(){let p=phases[n%2];txt.textContent=p[0];orb.textContent=p[0];orb.classList.toggle('in',p[1]);setTimeout(()=>{if(++n>=10){clearInterval(breathTimer);txt.textContent='Latihan selesai. Bagaimana keadaanmu?';orb.textContent='Selesai';orb.classList.remove('in')}},p[2]*1000)}step();breathTimer=setInterval(step,5000)}function saveJournal(type,textv){if(!textv.trim()){alert('Isi catatan terlebih dahulu.');return}data.journals.push({date:today(),type,text:textv});save(data);alert('Refleksi tersimpan di perangkat ini.');render()}
function insight(){let moods=data.moods.slice(-7),tracks=data.trackers.slice(-7),avg=tracks.length?(tracks.reduce((s,x)=>s+x.energy,0)/tracks.length).toFixed(1):'—',max=Math.max(1,...moods.map(x=>x.intensity));return `<div class="hello">Insight & perkembangan 🌱</div><p class="muted">Lihat catatanmu sebagai bahan memahami pola, bukan penilaian baik atau buruk.</p><div class="card"><div class="metric"><span>Total catatan emosi</span><strong>${data.moods.length}</strong></div><div class="metric"><span>Total pemantauan harian</span><strong>${data.trackers.length}</strong></div><div class="metric"><span>Rata-rata energi (7 catatan terakhir)</span><strong>${avg}${avg!=='—'?'/10':''}</strong></div><div class="metric"><span>Total jurnal refleksi</span><strong>${data.journals.length}</strong></div></div><div class="section-head"><h3>Intensitas emosi · 7 catatan terakhir</h3></div><div class="card">${moods.length?`<div class="chart">${moods.map(x=>`<div class="colbar"><i style="height:${x.intensity/max*100}%"></i><small>${esc(x.emoji)}</small></div>`).join('')}</div>`:'<div class="empty">Belum cukup data untuk grafik.</div>'}</div><div class="section-head"><h3>Energi · 7 catatan terakhir</h3></div><div class="card">${tracks.length?`<div class="chart">${tracks.map(x=>`<div class="colbar"><i style="height:${x.energy*10}%"></i><small>${x.energy}</small></div>`).join('')}</div>`:'<div class="empty">Belum cukup data untuk grafik.</div>'}</div><div class="section-head"><h3>Jeda sebelum keputusan finansial</h3></div><div class="danger">Jika energi sedang meningkat, tidur berkurang, atau muncul dorongan belanja yang tidak biasa, beri jeda sebelum transaksi besar. Catat alasan, tunggu sampai lebih tenang, dan pertimbangkan berdiskusi dengan orang tepercaya.</div><div class="section-head"><h3>Cadangkan datamu</h3></div><div class="card"><p class="muted">Data disimpan secara lokal di perangkat ini. Ekspor cadangan secara berkala agar tidak hilang saat data aplikasi dihapus.</p><button class="btn" onclick="exportData()">Unduh cadangan JSON</button><button class="btn secondary" onclick="exportCSV()">Ekspor catatan tracker CSV</button><button class="btn light" onclick="clearData()">Hapus seluruh data</button></div><p class="footnote">Grafik menunjukkan catatan yang kamu masukkan, bukan diagnosis atau penilaian klinis. Bawa ringkasan ini ke psikolog bila ingin membahas polanya.</p>`}
function download(name,txt,type){let b=new Blob([txt],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('mindtrack-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json')}function exportCSV(){let rows=[['Tanggal','Energi','Tidur','Kualitas tidur','Produktivitas','Fokus','Impulsivitas','Pengeluaran','Pembelian spontan'],...data.trackers.map(x=>[x.date,x.energy,x.sleep,x.sleepQuality,x.productivity,x.focus,x.impulse,x.spend,x.purchase])];download('mindtrack-tracker-'+today()+'.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}function clearData(){if(confirm('Yakin ingin menghapus semua catatan MindTrack dari perangkat ini? Tindakan ini tidak dapat dibatalkan.')){localStorage.removeItem('mindtrack_data');data=load();render()}}
render();
